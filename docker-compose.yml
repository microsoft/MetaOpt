# =============================================================================
# MetaOptimize Docker Compose Configuration
# =============================================================================
#
# Local development and testing only.
# MSRHub users: use `dotnet run` directly on the hub.
#
# Usage:
#   docker compose build
#   docker compose run --rm te-pop
#   docker compose run --rm binpacking
#
# =============================================================================

services:
  metaopt:
    build:
      context: .
      dockerfile: Dockerfile
    image: metaoptimize:latest
    volumes:
      - ./Topologies:/app/Topologies:ro
      - ./output:/app/output
      - ./licenses:/app/licenses:ro
    environment:
      - GRB_LICENSE_FILE=/app/licenses/gurobi.lic
      - GUROBI_THREADS=1
    command: ["--help"]

# -----------------------------------------------------------------------------
# Traffic Engineering Profiles
# -----------------------------------------------------------------------------

  te-pop:
    extends: metaopt
    command:
      - "--problemType"
      - "TrafficEngineering"
      - "--heuristic"
      - "Pop"
      - "--solver"
      - "OrTools"
      - "--paths"
      - "2"
      - "--verbose"

  te-demandpinning:
    extends: metaopt
    command:
      - "--problemType"
      - "TrafficEngineering"
      - "--heuristic"
      - "DemandPinning"
      - "--solver"
      - "Gurobi"
      - "--paths"
      - "2"
      - "--verbose"

  te-primal:
    extends: metaopt
    command:
      - "--problemType"
      - "TrafficEngineering"
      - "--heuristic"
      - "Pop"
      - "--solver"
      - "Gurobi"
      - "--method"
      - "PrimalDual"
      - "--paths"
      - "2"
      - "--verbose"

# -----------------------------------------------------------------------------
# Bin Packing Profiles
# -----------------------------------------------------------------------------

  binpacking:
    extends: metaopt
    command:
      - "--problemType"
      - "BinPacking"
      - "--solver"
      - "Gurobi"
      - "--numDemands"
      - "5"
      - "--verbose"

  binpacking-2d:
    extends: metaopt
    command:
      - "--problemType"
      - "BinPacking"
      - "--solver"
      - "Gurobi"
      - "--numDemands"
      - "5"
      - "--numDimensions"
      - "2"
      - "--verbose"

  binpacking-3d:
    extends: metaopt
    command:
      - "--problemType"
      - "BinPacking"
      - "--solver"
      - "Gurobi"
      - "--numDemands"
      - "4"
      - "--numDimensions"
      - "3"
      - "--verbose"

# -----------------------------------------------------------------------------
# PIFO Profiles
# -----------------------------------------------------------------------------

  pifo:
    extends: metaopt
    command:
      - "--problemType"
      - "PIFO"
      - "--solver"
      - "Gurobi"
      - "--verbose"

# -----------------------------------------------------------------------------
# Failure Analysis Profiles
# -----------------------------------------------------------------------------

  failure:
    extends: metaopt
    command:
      - "--problemType"
      - "FailureAnalysis"
      - "--solver"
      - "Gurobi"
      - "--verbose"
